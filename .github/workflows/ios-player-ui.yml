name: iOS Player Interaction
on:
  push:
    branches: ['claude/**', 'codex/**']
    paths:
      - 'app/ios-native/App/Sources/Features/Player/**'
      - 'app/ios-native/App/Sources/Common/Orientation.swift'
      - 'app/ios-native/PlayerUITests/**'
      - '.github/workflows/ios-player-ui.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ios-player-ui-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  player-ui:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Test production viewport and gestures on iPhone Simulator
        working-directory: app/ios-native/PlayerUITests
        run: |
          brew install xcodegen
          xcodegen generate
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in sorted(d["devices"].items(),reverse=True) if "iOS" in runtime for x in items if x["name"].startswith("iPhone")))')
          xcodebuild test -project PlayerInteractionHost.xcodeproj -scheme PlayerInteractionHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/PlayerInteractionTests.xcresult"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: player-interaction-test-results
          path: ${{ runner.temp }}/PlayerInteractionTests.xcresult
          if-no-files-found: ignore
