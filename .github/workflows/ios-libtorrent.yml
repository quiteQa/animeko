# M0: 验证 libtorrent 能交叉编译到 iOS 并在模拟器中运行 (见 app/ios-native/GOALS.md).
# 手写的独立 workflow, 不由 src.main.kts 生成. 产物 LibTorrent.xcframework 供后续 BT 集成使用.

name: 'iOS libtorrent (M0)'
on:
  workflow_dispatch: {}
  push:
    branches:
    - 'claude/**'
    - 'codex/**'
    paths:
    - 'app/ios-native/libtorrent/**'
    - '.github/workflows/ios-libtorrent.yml'
concurrency:
  group: 'ios-libtorrent-${{ github.ref_name }}'
  cancel-in-progress: true
jobs:
  build:
    name: 'Build libtorrent for iOS and run smoke test'
    runs-on: 'macos-15-intel'
    timeout-minutes: 90
    permissions:
      contents: 'read'
    steps:
    - uses: 'actions/checkout@v6'

    - name: 'Show toolchain'
      run: |
        xcodebuild -version
        cmake --version
        xcrun simctl list runtimes

    - name: 'Build'
      uses: actions/cache/restore@v4
      id: native-cache
      with:
        path: app/ios-native/libtorrent/build
        key: ios-lt-${{ runner.arch }}-${{ hashFiles('app/ios-native/libtorrent/versions.env') }}-${{ hashFiles('app/ios-native/libtorrent/bridge/**', 'app/ios-native/libtorrent/CMakeLists.txt') }}
        restore-keys: ios-lt-${{ runner.arch }}-${{ hashFiles('app/ios-native/libtorrent/versions.env') }}-

    - name: 'Build native engine'
      run: './app/ios-native/libtorrent/build-ios.sh'

    - uses: actions/cache/save@v4
      if: steps.native-cache.outputs.cache-hit != 'true'
      with:
        path: app/ios-native/libtorrent/build
        key: ${{ steps.native-cache.outputs.cache-primary-key }}

    - name: 'Offline P2P bridge regression'
      run: |
        device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in sorted(d["devices"].items(),reverse=True) if "iOS" in runtime for x in items if x["name"].startswith("iPhone")))')
        xcrun simctl boot "$device" || true
        xcrun simctl bootstatus "$device" -b
        binary="$GITHUB_WORKSPACE/app/ios-native/libtorrent/build/ios-simulator/bin/lt-bridge-tests"
        codesign -s - -f "$binary"
        xcrun simctl spawn "$device" "$binary" "$RUNNER_TEMP/lt/bridge-test-data"

    - name: 'Smoke test in simulator'
      continue-on-error: true
      run: './app/ios-native/libtorrent/run-smoke.sh'

    - name: 'Upload xcframework'
      if: '${{ always() }}'
      uses: 'actions/upload-artifact@v6'
      with:
        name: 'LibTorrent-xcframework'
        path: app/ios-native/libtorrent/build/LibTorrent.xcframework
        if-no-files-found: 'ignore'
