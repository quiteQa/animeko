name: iOS Frame Bridge Lab
on:
  pull_request:
    paths:
      - 'app/ios-native/FrameLab/**'
      - 'app/ios-native/App/Sources/Features/Player/Support/FrameProbePolicy.swift'
      - '.github/workflows/ios-frame-lab.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ios-frame-lab-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  sdk-interop:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check public IOSurface API against device and simulator SDKs
        run: |
          status=0
          for sdk in iphoneos iphonesimulator; do
            sdk_path=$(xcrun --sdk "$sdk" --show-sdk-path)
            target=arm64-apple-ios26.0
            if [ "$sdk" = iphonesimulator ]; then target="$target-simulator"; fi
            echo "Checking $sdk at $sdk_path"
            sed -n '1,65p' "$sdk_path/System/Library/Frameworks/OpenGLES.framework/Headers/EAGLIOSurface.h"
            if ! xcrun --sdk "$sdk" clang -target "$target" -isysroot "$sdk_path" \
              -fobjc-arc -fmodules -fsyntax-only -Werror=objc-method-access \
              app/ios-native/FrameLab/Sources/ProbeSurfaceTexture.m; then
              status=1
            fi
          done
          exit "$status"
  frame-bridge:
    needs: sdk-interop
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Generate the isolated frame bridge project
        working-directory: app/ios-native/FrameLab
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,group in sorted(d["devices"].items(),reverse=True) if "iOS-" in runtime and int(runtime.split("iOS-")[-1].split("-")[0]) >= 26 for x in group if x["name"].startswith("iPhone")))')
          echo "PROBE_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build the native bridge and test host
        id: build
        working-directory: app/ios-native/FrameLab
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project NativeFrameLab.xcodeproj -scheme NativeFrameLab \
            -destination "platform=iOS Simulator,id=$PROBE_SIMULATOR" \
            -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/frame-build.log"
      - name: Boot the test simulator
        run: |
          xcrun simctl boot "$PROBE_SIMULATOR" || true
          xcrun simctl bootstatus "$PROBE_SIMULATOR" -b
      - name: Test real mpv to CVPixelBuffer output
        working-directory: app/ios-native/FrameLab
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test-without-building -project NativeFrameLab.xcodeproj -scheme NativeFrameLab \
            -destination "platform=iOS Simulator,id=$PROBE_SIMULATOR" \
            -derivedDataPath .build/DerivedData \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 90 \
            -resultBundlePath "$RUNNER_TEMP/FrameBridge.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/frame-bridge.log"
      - name: Archive the standalone probe (unsigned)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: app/ios-native/FrameLab
        run: |
          set -o pipefail
          xcodebuild archive -project NativeFrameLab.xcodeproj -scheme NativeFrameLab \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NativeFrameLab.xcarchive" CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/frame-lab-archive.log"
          mkdir -p "$RUNNER_TEMP/probe/Payload"
          cp -R "$RUNNER_TEMP/NativeFrameLab.xcarchive/Products/Applications/NativeFrameLab.app" "$RUNNER_TEMP/probe/Payload/"
          (cd "$RUNNER_TEMP/probe" && zip -qry ../NativeFrameLab-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frame-bridge-validation
          path: |
            ${{ runner.temp }}/FrameBridge.xcresult
            ${{ runner.temp }}/frame-build.log
            ${{ runner.temp }}/frame-bridge.log
            ${{ runner.temp }}/frame-lab-archive.log
            ${{ runner.temp }}/NativeFrameLab-unsigned.ipa
          if-no-files-found: ignore
